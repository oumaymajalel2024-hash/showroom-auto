<div class="search-wrapper">
  <label for="brand-search">Find your next car</label>
  <div class="search-box">
    <input
      id="brand-search"
      type="text"
      #brand
      placeholder="Search by brand..."
      (input)="selectAutos(brand.value)"
    />
  <fa-icon [icon]="faMagnifyingGlass"></fa-icon>
  </div>
</div>

<div class="cars-container">
  @for (auto of selectedAutos; track auto.id) {
    <div class="auto-card">
      <img [src]="`images/${auto.photo}`" alt="" />
      <div class="details">
        <h3>{{ auto.brand }} {{ auto.model }}</h3>
        <p>
          power : {{ auto.power }} <br />
          Price : {{ auto.price }} DNT <br />
          Only {{ auto.availability }} units in stock
        </p>
        @if (selectedCar?.id === auto.id) {
          <p>{{ auto.description }}</p>
        }
      </div>
      <div class="see_more">
        <button (click)="selectCar(auto)">
          {{ selectedCar?.id === auto.id ? 'See less' : 'See more...' }}
        </button>
      </div>
    </div>
  }
</div>
